name: Monitor Figara

on:
  schedule:
    - cron: '*/30 * * * *'   # só reinicia o ciclo se ele tiver parado; o GitHub atrasa agendamentos por horas
  workflow_dispatch:
    inputs:
      simular_queda:
        description: 'Teste: finge que o site caiu (abre e depois fecha o aviso)'
        type: boolean
        default: false
      segundos:
        description: 'Duração do ciclo em segundos (padrão 20700 = 5h45)'
        default: '20700'

permissions:
  contents: write   # sinal de vida mensal (impede o GitHub de desligar o agendamento)
  issues: write     # abre/fecha o aviso de queda
  actions: write    # inicia o próximo ciclo

# Um ciclo por vez; o seguinte espera na fila (só 1 fica pendente).
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir a cada minuto
        env:
          SIMULAR: ${{ inputs.simular_queda }}
          SEGUNDOS: ${{ inputs.segundos }}
        run: |
          [ "$SIMULAR" = "true" ] && export ALVO_SITE="https://figaracare.com/pagina-de-teste-inexistente"
          [ -n "$SEGUNDOS" ] && export MONITOR_SEGUNDOS="$SEGUNDOS"
          bash monitor.sh

      # O GitHub desliga agendamentos de repositórios públicos sem atividade por 60 dias.
      - name: Sinal de vida (1 commit por mês)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
            date -u > .keepalive
            git config user.name "figara-monitor"; git config user.email "monitor@users.noreply.github.com"
            git add .keepalive && git commit -m "sinal de vida" && git push
          fi

      # Encadeia: ao terminar o ciclo, inicia o próximo (a fila do 'concurrency' o segura até este acabar).
      - name: Iniciar o próximo ciclo
        if: success() || failure()
        run: gh workflow run monitor.yml
